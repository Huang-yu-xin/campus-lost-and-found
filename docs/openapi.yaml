components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 登录会话 Cookie；由浏览器管理，不是 Bearer/JWT。匿名会话不等于已认证身份。
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: 所有写接口包括注册、登录必须携带；通过 GET /auth/csrf 获取，关联当前会话。
      schema:
        type: string
        minLength: 1
  schemas:
    Id: *id003
    ItemStatus:
      type: string
      description: 物品审核与发布状态。
      enum:
      - PENDING_REVIEW
      - RETURNED
      - PUBLISHED
      - OFF_SHELF
      - ARCHIVED
    ClaimStatus:
      type: string
      description: CLOSED 为本草案补充的系统关闭状态，不等同于发布人驳回。
      enum:
      - PENDING
      - CONFIRMED
      - REJECTED
      - COMPLETED
      - CLOSED
    EmptyData:
      type: object
      description: 操作成功，无额外数据。
      additionalProperties: false
      properties: {}
    FieldError:
      type: object
      description: ''
      additionalProperties: false
      properties:
        field:
          type: string
          description: 字段路径。
        message:
          type: string
          description: 字段错误说明。
      required:
      - field
      - message
    ErrorResponse:
      type: object
      description: ''
      additionalProperties: false
      properties:
        code:
          type: string
          description: 稳定的业务错误码，见接口文档错误码表。
        message:
          type: string
          description: 可向用户展示的错误说明，不包含内部堆栈。
        data:
          type: object
          nullable: true
          enum:
          - null
          description: 错误响应固定为 null。
        requestId:
          type: string
          description: 请求追踪编号。
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - code
      - message
      - data
      - requestId
      - errors
    CsrfData:
      type: object
      description: ''
      additionalProperties: false
      properties:
        headerName:
          type: string
          description: 固定请求头。
          enum:
          - X-CSRF-TOKEN
        token:
          type: string
          description: 与会话绑定的 CSRF 令牌。
      required:
      - headerName
      - token
    SendCodeRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        email: &id006
          type: string
          description: ASCII 邮箱地址；去首尾空白后按小写规范化，学校邮箱域名由项目配置决定。
          format: email
          maxLength: 254
          pattern: ^[\x21-\x7E]+$
      required:
      - email
    CodeSentData:
      type: object
      description: ''
      additionalProperties: false
      properties:
        deliveryMode:
          type: string
          description: DEV_FILE 为模拟发送到开发收件箱；SMTP 为已提交给邮件服务。
          enum: [DEV_FILE, SMTP]
        expiresInSeconds:
          type: integer
          description: 有效期。
          enum:
          - 300
        retryAfterSeconds:
          type: integer
          description: 再次发送等待时间，草案 60 秒。
          enum:
          - 60
      required:
      - expiresInSeconds
      - retryAfterSeconds
      - deliveryMode
    RegisterRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        studentId:
          type: string
          description: 数字学号；实际学校位数待确定，当前结构上限 32。
          pattern: ^[0-9]+$
          maxLength: 32
        realName:
          type: string
          description: 与模拟学生名册一致，2～10 个汉字。
          minLength: 2
          maxLength: 10
          pattern: ^[\u3400-\u9fff]+$
        campusCardNo:
          type: string
          description: 唯一校园卡号；实际格式待确认，当前 1～32 个 ASCII 可见字符。
          minLength: 1
          maxLength: 32
          pattern: ^[\x21-\x7E]+$
        email: *id006
        emailCode:
          type: string
          description: 注册用途验证码。
          pattern: ^[0-9]{6}$
        password: &id008
          type: string
          description: 至少 8 字符且含字母和数字；草案上限 64 字符，不能记录到日志。
          minLength: 8
          maxLength: 64
          pattern: ^(?=.*[A-Za-z])(?=.*[0-9]).+$
          writeOnly: true
        nickname:
          type: string
          description: 可选公开昵称；未填写使用不暴露真实身份的默认昵称。
          minLength: 1
          maxLength: 30
      required:
      - studentId
      - realName
      - campusCardNo
      - email
      - emailCode
      - password
    LoginRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        account:
          type: string
          description: 学号、校园卡号或预置管理员账号；统一登录标识表排除跨字段身份歧义。
          minLength: 1
          maxLength: 32
          pattern: ^[\x21-\x7E]+$
        password:
          type: string
          description: 登录密码。
          minLength: 1
          maxLength: 64
          writeOnly: true
      required:
      - account
      - password
    Me:
      type: object
      description: ''
      additionalProperties: false
      properties:
        id: *id003
        studentId:
          type: string
          description: 自己的学号。学生从绑定名册取得；预置管理员为 null。
          nullable: true
        realName:
          type: string
          description: 自己的姓名。学生从绑定名册取得；预置管理员为 null。
          nullable: true
        campusCardNo:
          type: string
          description: 自己的卡号。学生从绑定名册取得；预置管理员为 null。
          nullable: true
        nickname:
          type: string
          description: 公开昵称。
        email: *id006
        phone:
          type: string
          description: 自己的手机号，未填写为 null。
          nullable: true
          maxLength: 20
        role:
          type: string
          description: 管理员由预置账号产生，注册不能指定角色。
          enum:
          - STUDENT
          - ADMIN
        version: &id021
          type: integer
          description: 当前资源版本，从 1 开始；更新成功后递增。
          minimum: 1
      required:
      - id
      - studentId
      - realName
      - campusCardNo
      - nickname
      - email
      - phone
      - role
      - version
    ProfilePatchRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        expectedVersion: &id007
          type: integer
          description: 调用方最后读取的目标资源 version；不一致返回 409 VERSION_CONFLICT。
          minimum: 1
        nickname:
          type: string
          description: 昵称。
          minLength: 1
          maxLength: 30
        phone:
          type: string
          description: 手机号；null 表示清空。
          nullable: true
          pattern: ^\+?[0-9 -]{6,20}$
          maxLength: 20
      minProperties: 2
      required:
      - expectedVersion
    ChangeEmailRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        expectedVersion: *id007
        email: *id006
        emailCode:
          type: string
          description: 绑定到当前用户和新邮箱的修改邮箱验证码。
          pattern: ^[0-9]{6}$
      required:
      - expectedVersion
      - email
      - emailCode
    ChangePasswordRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        oldPassword:
          type: string
          description: 原密码。
          minLength: 1
          maxLength: 64
          writeOnly: true
        newPassword: *id008
      required:
      - oldPassword
      - newPassword
    VersionRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        expectedVersion: *id007
      required:
      - expectedVersion
    ReasonVersionRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        expectedVersion: *id007
        reason: &id022
          type: string
          description: 去除首尾空白后必填；草案上限 500 字。
          minLength: 1
          maxLength: 500
      required:
      - expectedVersion
      - reason
    Image:
      type: object
      description: ''
      additionalProperties: false
      properties:
        id: *id003
        url:
          type: string
          description: 受物品可见性控制的图片地址，例如 /api/v1/images/501。
        mediaType:
          type: string
          description: ''
          enum:
          - image/jpeg
          - image/png
        sizeBytes:
          type: integer
          description: 实际字节数。
          minimum: 1
          maximum: 2097152
      required:
      - id
      - url
      - mediaType
      - sizeBytes
    UploadImageRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        file:
          type: string
          description: JPG/PNG；校验真实内容，大小 1～2097152 字节。
          format: binary
      required:
      - file
    Publisher:
      type: object
      description: ''
      additionalProperties: false
      properties:
        id: *id003
        nickname:
          type: string
          description: 只返回昵称，不返回真实姓名、学号、联系方式。
      required:
      - id
      - nickname
    CreateItemRequest:
      type: object
      description: ''
      additionalProperties: false
      properties:
        type: *id009
        category: *id010
        location: &id011
          type: string
