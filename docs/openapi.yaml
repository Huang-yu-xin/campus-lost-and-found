        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-25
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-listMyClues-01
  /me/received-clues:
    get:
      operationId: listReceivedClues
      summary: 查询我收到的线索
      description: 只返回自己的寻物信息收到的线索；createdAt、id 降序。
      tags:
      - 个人中心
      parameters:
      - *id001
      - *id002
      - name: itemId
        in: query
        required: false
        description: 正整数 ID，以字符串传输，不在前端转为 Number。
        schema: *id003
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
