        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-15
      - FR-28
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-listReceivedClaims-01
  /me/clues:
    get:
      operationId: listMyClues
      summary: 查询我提供的线索
      description: 只返回自己的线索，createdAt、id 降序。
      tags:
      - 个人中心
      parameters:
      - *id001
      - *id002
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
