openapi: 3.0.3
info:
  title: 校园失物招领系统接口合同
  version: 0.1.0-draft
  description: 开发前合同草案，尚无实现或测试通过声明。D-01～D-04 为已确认产品选择，其余 BR 规则为本轮设计建议，待团队评审。路径服务器前缀 /api/v1。
servers:
- url: http://localhost:8080/api/v1
  description: 本地开发
security:
- SessionAuth: []
tags:
- name: 认证
- name: 个人中心
- name: 发布与查找
- name: 认领
- name: 线索
- name: 联系方式
- name: 管理
- name: 举报
paths:
  /auth/csrf:
    get:
      operationId: getCsrf
      summary: 获取 CSRF 令牌
      description: 匿名也可调用；必要时建立匿名会话，不产生已登录身份。登录、退出或改密后重新获取令牌。
      tags:
      - 认证
      parameters: []
      security: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
            Set-Cookie:
              schema:
                type: string
              description: 会话创建、登录轮换或会话注销时由服务端设置 JSESSIONID；HttpOnly、SameSite=Lax，HTTPS 环境加 Secure。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfDataResponse'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - SUP-01
      x-rule-ids:
      - BR-01
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-getCsrf-01
  /auth/email-codes:
    post:
      operationId: sendRegistrationCode
      summary: 发送注册验证码
      description: 6 位数字，5 分钟有效，绑定注册用途与邮箱；重发替换旧码，成功注册时原子消费。草案每邮箱与来源组合限制发送频率。演示邮件接收方式见 P-01。
      tags:
      - 认证
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSentDataResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-01
      x-rule-ids:
      - BR-02
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-sendRegistrationCode-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
  /auth/register:
    post:
      operationId: register
      summary: 注册并绑定校园身份
      description: 仅创建学生账号，不自动登录。模拟名册匹配、邮箱验证码和唯一性检查通过后原子创建。拒绝未知 role 字段。手机号可在个人资料补充。
      tags:
      - 认证
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security: []
      responses:
        '201':
          description: 成功。创建资源。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-01
      x-rule-ids:
      - BR-02
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-register-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      operationId: login
      summary: 登录
      description: 成功轮换会话 ID，返回当前用户；邮箱不作为登录账号。学号与卡号跨列冲突必须在建号时排除。登录失败不永久锁号，可临时限流。
      tags:
      - 认证
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
            Set-Cookie:
              schema:
                type: string
              description: 会话创建、登录轮换或会话注销时由服务端设置 JSESSIONID；HttpOnly、SameSite=Lax，HTTPS 环境加 Secure。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-02
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-login-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      description: 使当前会话失效，清除会话 Cookie；旧会话访问私有接口返回 401。
      tags:
      - 认证
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
            Set-Cookie:
              schema:
                type: string
              description: 会话创建、登录轮换或会话注销时由服务端设置 JSESSIONID；HttpOnly、SameSite=Lax，HTTPS 环境加 Secure。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-02
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-logout-01
  /me:
    get:
      operationId: getMe
      summary: 查询自己的资料
      description: 不接受 userId 查询参数。
      tags:
      - 个人中心
      parameters: []
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-06
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-getMe-01
    patch:
      operationId: updateProfile
      summary: 修改昵称和手机号
      description: 学号、姓名、校园卡和角色不可修改；邮箱通过独立验证码流程更改。变更实际联系方式时，在同一事务中撤回该用户对应字段的全部既有授权，防止静默分享新值。
      tags:
      - 个人中心
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-06
      x-rule-ids:
      - BR-07
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-updateProfile-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
  /me/email-codes:
    post:
      operationId: sendChangeEmailCode
      summary: 发送修改邮箱验证码
      description: 验证码绑定当前用户、新邮箱和修改邮箱用途，不能用于注册。
      tags:
      - 个人中心
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSentDataResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-06
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-sendChangeEmailCode-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
  /me/email:
    put:
      operationId: changeEmail
      summary: 确认修改邮箱
      description: 检查唯一性与验证码后更新；撤回该用户所有 emailVisible 授权，记录版本变化。
      tags:
      - 个人中心
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-06
      x-rule-ids:
      - BR-07
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-changeEmail-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
  /me/password:
    put:
      operationId: changePassword
      summary: 修改密码
      description: 原密码验证通过后修改，旧密码不可再登录；草案使该用户全部登录会话失效，修改者也须重新登录。
      tags:
      - 个人中心
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
            Set-Cookie:
              schema:
                type: string
              description: 会话创建、登录轮换或会话注销时由服务端设置 JSESSIONID；HttpOnly、SameSite=Lax，HTTPS 环境加 Secure。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-03
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-changePassword-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
  /me/items:
    get:
      operationId: listMyItems
      summary: 查询我的发布
      description: 包含待审核、退回、下架和归档记录；createdAt、id 降序，只返回当前用户的数据。
      tags:
      - 个人中心
      parameters:
      - &id001
        name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - &id002
        name: pageSize
        in: query
        required: false
        description: ''
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 50
          default: 10
      - name: status
        in: query
        required: false
        description: 查询条件。
        schema:
          $ref: '#/components/schemas/ItemStatus'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemRecordPageResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-04
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-listMyItems-01
  /me/items/{itemId}:
    get:
      operationId: getMyItem
      summary: 查询我的发布详情
      description: 归属不匹配统一 404；用于待审核或归档后的个人管理。
      tags:
      - 个人中心
      parameters:
      - name: itemId
        in: path
        required: true
        description: 目标资源编号。
        schema:
          $ref: '#/components/schemas/Id'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemRecordResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-04
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-getMyItem-01
  /me/claims:
    get:
      operationId: listMyClaims
      summary: 查询我提交的认领
      description: 只查询 applicant 为当前用户；createdAt、id 降序。
      tags:
      - 个人中心
      parameters:
      - *id001
      - *id002
      - name: status
        in: query
        required: false
        description: 查询条件。
        schema:
          $ref: '#/components/schemas/ClaimStatus'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPageResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      x-owner: 甲
      x-requirement-ids:
      - FR-05
      x-rule-ids: []
      x-scope: core
      x-contract-status: draft
      x-test-ids:
      - CT-listMyClaims-01
  /me/received-claims:
    get:
      operationId: listReceivedClaims
      summary: 查询我收到的认领
      description: 只查询属于当前发布人的物品申请；过滤 itemId 不得扩大归属范围。
      tags:
      - 个人中心
      parameters:
      - *id001
      - *id002
      - name: itemId
        in: query
        required: false
        description: 正整数 ID，以字符串传输，不在前端转为 Number。
        schema: &id003
          type: string
          description: 正整数 ID，以字符串传输，不在前端转为 Number。
          pattern: ^[1-9][0-9]*$
          example: '1001'
      - name: status
        in: query
        required: false
        description: 查询条件。
        schema:
          $ref: '#/components/schemas/ClaimStatus'
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 所有响应使用 no-store；特别是私有详情、验证码、CSRF 和联系方式。
          content:
            application/json:
              schema:
