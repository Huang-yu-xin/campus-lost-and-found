    Error400:
      description: 参数或业务输入不合法。可能错误码：VALIDATION_ERROR, IDENTITY_MISMATCH, EMAIL_CODE_INVALID, EMAIL_CODE_EXPIRED,
        EMAIL_CODE_USED, OLD_PASSWORD_INCORRECT, CONTACT_FIELD_MISSING, REPORT_CONTEXT_INVALID
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: 未登录、会话失效或凭据错误。可能错误码：AUTH_REQUIRED, BAD_CREDENTIALS
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: 权限不足、CSRF 校验失败或尚未授权。可能错误码：FORBIDDEN, CSRF_INVALID, SELF_OPERATION_NOT_ALLOWED, CONTACT_NOT_AUTHORIZED
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: 不存在或对当前访问者不可见。可能错误码：RESOURCE_NOT_FOUND
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: 版本、状态或唯一性冲突。可能错误码：VERSION_CONFLICT, IDENTITY_ALREADY_BOUND, ACCOUNT_IDENTIFIER_CONFLICT, EMAIL_ALREADY_BOUND,
        ITEM_STATE_CONFLICT, CLAIM_ALREADY_EXISTS, ITEM_ALREADY_CLAIMED, CLAIM_STATE_CONFLICT, CLUE_ALREADY_EXISTS,
        CONTACT_NOT_ACTIVE, CONVERSATION_CLOSED, IMAGE_ALREADY_BOUND, REPORT_STATE_CONFLICT
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error413:
      description: 图片大小超限。可能错误码：IMAGE_TOO_LARGE
